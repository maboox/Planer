name: Android • build & verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint & installable preview
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          chmod +x gradlew
      - name: Verify and build
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease runtimeInventory --no-daemon --console=plain
      - name: Prepare download
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/debug/app-debug.apk distribution/naghshechi-preview.apk
          cd distribution
          sha256sum naghshechi-preview.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: naghshechi-preview
          path: distribution/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/schemas/
          retention-days: 14

  preview:
    name: Publish preview download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: naghshechi-preview
          path: distribution
      - name: Update preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$BUILD_SHA" -F force=true
          else
            gh release create preview --target "$BUILD_SHA" --prerelease --title 'نقشه‌چی | نسخهٔ آزمایشی' --notes 'نسخهٔ آزمایشی اندروید. برای نصب فایل APK را دریافت کنید. کلید AvalAI اختیاری است و داخل برنامه وارد می‌شود. این نسخه برای آزمایش است و نسخهٔ آمادهٔ انتشار بازار محسوب نمی‌شود.'
          fi
          gh release upload preview distribution/* --clobber

  signed-release:
    name: Signed store package
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Require signing secrets
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_STORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Configure all four ANDROID signing secrets before tagging a store release.'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod +x gradlew
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed packages
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
